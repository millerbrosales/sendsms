<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "Miller Bros SMS" }}</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#16181d}
    .nav{background:#111827;color:white;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
    .nav a{color:white;text-decoration:none;margin-right:18px}
    .wrap{max-width:1050px;margin:30px auto;padding:0 18px}
    .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .stat{font-size:30px;font-weight:700}
    .muted{color:#6b7280}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}
    input[type=password],input[type=file]{padding:12px;border:1px solid #d1d5db;border-radius:8px;width:100%;box-sizing:border-box}
    button,.btn{background:#111827;color:white;border:none;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block}
    .good{background:#ecfdf5;border:1px solid #a7f3d0;padding:12px;border-radius:8px}
    .bad{background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px}
    code{background:#f3f4f6;padding:2px 5px;border-radius:5px}
  </style>
</head>
<body>
{% if request.session.get("logged_in") %}
<div class="nav">
  <div><strong>Miller Bros SMS</strong></div>
  <div>
    <a href="/">Dashboard</a>
    <a href="/upload">Upload CSV</a>
    <form method="post" action="/logout" style="display:inline"><button style="padding:7px 10px">Log out</button></form>
  </div>
</div>
{% endif %}
<div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
